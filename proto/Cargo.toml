[package]
name = "plant-trace-proto"
description = "Wire format shared by the host CLI, the nRF52840 DAQ and the ESP32 signal generator"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
postcard.workspace = true
crc.workspace = true
cobs = { version = "0.3", default-features = false }
serde_bytes = { version = "0.11", default-features = false }
libm = "0.2"

[features]
default = ["std"]
std = ["serde/std", "postcard/use-std", "serde_bytes/std"]
